name: Download Python 3.8.5 Pip Packages

on:
  workflow_dispatch:

jobs:
  download:
    runs-on: windows-2025

    steps:

      # ==========================================
      # 1. 取得 Repository
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================
      # 2. 安裝 Python 3.8.5
      # ==========================================
      - name: Setup Python 3.8.5
        uses: actions/setup-python@v5
        with:
          python-version: '3.8.5'

      # ==========================================
      # 3. 確認 Python / pip
      # ==========================================
      - name: Check Python
        shell: powershell
        run: |
          python --version
          python -m pip --version

      # ==========================================
      # 4. 建立 wheels 資料夾
      # ==========================================
      - name: Create wheels directory
        shell: powershell
        run: |
          New-Item `
            -ItemType Directory `
            -Force `
            -Path "$env:GITHUB_WORKSPACE\wheels"

      # ==========================================
      # 5. 下載所有 pip 套件及相依套件
      # ==========================================
      - name: Download pip packages
        shell: powershell
        run: |
          python -m pip download `
            -r requirements.txt `
            -d wheels `
            --only-binary=:all:

      # ==========================================
      # 6. 列出下載結果
      # ==========================================
      - name: List downloaded packages
        shell: powershell
        run: |
          Write-Host "===== Downloaded packages ====="

          Get-ChildItem wheels -File |
            Sort-Object Name |
            Select-Object -ExpandProperty Name

          Write-Host ""
          Write-Host "Total files:"

          (Get-ChildItem wheels -File).Count

      # ==========================================
      # 7. 建立 ZIP
      # ==========================================
      - name: Create ZIP
        shell: powershell
        run: |
          $packageDir = "$env:GITHUB_WORKSPACE\pip-packages"

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $packageDir

          # 複製 requirements.txt
          Copy-Item `
            "$env:GITHUB_WORKSPACE\requirements.txt" `
            "$packageDir\requirements.txt"

          # 複製 wheels
          New-Item `
            -ItemType Directory `
            -Force `
            -Path "$packageDir\wheels"

          Copy-Item `
            "$env:GITHUB_WORKSPACE\wheels\*" `
            "$packageDir\wheels\" `
            -Force

          # 建立說明文件
          @"
          Python version:
          3.8.5

          Platform:
          Windows 64-bit

          Offline installation:

          python -m pip install --no-index --find-links=.\wheels -r requirements.txt
          "@ | Out-File `
            "$packageDir\README.txt" `
            -Encoding utf8

          # 壓縮
          Compress-Archive `
            -Path "$packageDir\*" `
            -DestinationPath "$env:GITHUB_WORKSPACE\python-3.8.5-pip-packages.zip" `
            -Force

      # ==========================================
      # 8. 上傳 Artifact
      # ==========================================
      - name: Upload pip packages
        uses: actions/upload-artifact@v4
        with:
          name: python-3.8.5-pip-packages
          path: python-3.8.5-pip-packages.zip
          if-no-files-found: error
